
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#226B4A"
backgroundColor = "#E3EFE3"
secondaryBackgroundColor = "#F1F7EE"
textColor = "#17271E"
linkColor = "#185B3C"

chartCategoricalColors = [
    "#26704E",
    "#649C7C",
    "#437D69",
    "#8CBBA1",
    "#355E50",
    "#A4C5A9"
]

